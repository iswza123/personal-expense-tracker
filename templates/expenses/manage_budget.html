<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monthly Budget</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .budget-container {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #26344a;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            text-align: left;
            margin-bottom: 18px;
            color: #26344a;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #5470c6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #405ba8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #5470c6;
            text-decoration: none;
        }

        .errorlist {
            color: #e74c3c;
        }
    </style>
</head>

<body>

<div class="budget-container">

    <h1>Monthly Budget</h1>

    <p>Set your monthly spending limit.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Monthly Budget</button>
    </form>

    <a href="{% url 'dashboard' %}" class="back-link">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
