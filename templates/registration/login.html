<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 25px;
        }
        .auth-card {
            max-width: 420px;
            margin: 65px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }
        h1 { text-align: center; color: #26344a; }
        .subtitle { text-align: center; color: #666; }
        form p { margin-bottom: 18px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #5470c6;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }
        .auth-link { text-align: center; margin-top: 22px; }
        a { color: #5470c6; text-decoration: none; }
        .errorlist { color: #d93025; }
    </style>
</head>
<body>
<div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your Personal Expense Tracker</p>

    <form method="POST">
        {% csrf_token %}
        {% if form.errors %}
            <p class="errorlist">Please check your username and password.</p>
        {% endif %}
        {{ form.as_p }}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">Login</button>
    </form>

    <div class="auth-link">
        Don't have an account?
        <a href="{% url 'register' %}">Create an account</a>
    </div>
</div>
</body>
</html>
